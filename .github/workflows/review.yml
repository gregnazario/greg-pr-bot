name: Review my pull requests

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: greg-pr-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out the reviewer
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Create a short-lived GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: gregnazario
          permission-contents: read
          permission-issues: write
          permission-pull-requests: write

      - name: Install Pi
        run: npm install --global --ignore-scripts @earendil-works/pi-coding-agent@0.84.2

      - name: Review new PR commits
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PI_MODELS: ${{ vars.PI_MODELS || 'zai/glm-5.3:high' }}
          PR_AUTHOR: gregnazario
          MAX_REVIEWS_PER_RUN: "5"
          PI_CODING_AGENT_DIR: ${{ runner.temp }}/pi-agent
          PI_SKIP_VERSION_CHECK: "1"
          PI_TELEMETRY: "0"
          NO_COLOR: "1"
        run: node scripts/review-prs.mjs
